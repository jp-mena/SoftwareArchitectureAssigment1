global
    daemon
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option httpchk GET /health/db
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Frontend para el dominio app.localhost
frontend app_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/app.localhost.pem
    
    # Redirigir HTTP a HTTPS
    redirect scheme https if !{ ssl_fc }
    
    # Servir archivos estáticos directamente
    acl is_static path_beg /static/
    acl is_upload path_beg /uploads/
    
    # Si es un archivo estático, servirlo desde el sistema de archivos
    use_backend static_files if is_static
    use_backend upload_files if is_upload
    
    # Para todo lo demás, enviar a la aplicación
    default_backend app_backend

# Backend para archivos estáticos
backend static_files
    mode http
    http-request set-path %[path,regsub(^/static/,/)]
    http-request set-header Host app.localhost
    server static1 127.0.0.1:8080 check

# Backend para archivos de upload
backend upload_files
    mode http
    http-request set-path %[path,regsub(^/uploads/,/)]
    http-request set-header Host app.localhost
    server upload1 127.0.0.1:8080 check

# Backend para la aplicación
backend app_backend
    mode http
    balance roundrobin
    option httpchk GET /health/db
    http-check expect status 200
    
    # Servidores de la aplicación
    server app1 app:8000 check inter 2000ms rise 2 fall 3
    server app2 app:8000 check inter 2000ms rise 2 fall 3 backup

# Estadísticas de HAProxy
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE
